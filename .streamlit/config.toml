[theme]
base = "light"
primaryColor = "#2F8F4E"
backgroundColor = "#FBF9F5"
secondaryBackgroundColor = "#F1EBE0"
textColor = "#1E2A4A"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

# Barra lateral escura e quente, no marrom do pitch (precisa do Streamlit 1.46 ou mais novo)
[theme.sidebar]
backgroundColor = "#1F1612"
secondaryBackgroundColor = "#2E211B"
textColor = "#F3EDE3"
